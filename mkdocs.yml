site_name: Linux Mastery Path
site_description: A free Linux course — the filesystem, permissions, users, processes, packages, systemd, logging, disks, networking, firewalls, container building blocks, performance and troubleshooting.
site_url: https://sigilipelli.github.io/linux-mastery-path/
repo_url: https://github.com/sigilipelli/linux-mastery-path
repo_name: linux-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css

extra_javascript:
  - javascripts/progress-tracker.js

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - License: license.md
  - "Level 1 · Linux Foundations":
      - Overview: level-1/index.md
      - "01 · What Linux Is: Kernel, Distributions & Userland": level-1/01-what-linux-is.md
      - "02 · The Filesystem Hierarchy & Everything Is a File": level-1/02-filesystem-hierarchy.md
      - "03 · Files, Directories, Links & Inodes": level-1/03-files-links-inodes.md
      - "04 · Permissions, umask, setuid & ACLs": level-1/04-permissions.md
      - "05 · Users, Groups & sudo": level-1/05-users-groups-sudo.md
      - "06 · Text Streams, Pipes & the Core Tools": level-1/06-text-pipelines.md
      - "07 · Processes, Signals & Job Control": level-1/07-processes-signals.md
      - "08 · Package Management: apt, dnf & Friends": level-1/08-package-management.md
      - "09 · Getting Help: man, info & Reading Docs": level-1/09-getting-help.md
      - "10 · Project — A Portable System Audit Script": level-1/10-project-portable-audit.md
