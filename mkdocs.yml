site_name: Linux Mastery Path
site_description: A free Linux Fundamentals course — the kernel, filesystem and permission model, process and memory management, systemd, networking internals, namespaces/cgroups, security modules, and performance troubleshooting.
site_url: https://sigilipelli.github.io/linux-mastery-path/
repo_url: https://github.com/sigilipelli/linux-mastery-path
repo_name: linux-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css

extra_javascript:
  - javascripts/progress-tracker.js

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - License: license.md
  - "Level 1 · The Kernel, Filesystem & Permissions":
      - Overview: level-1/index.md
      - "01 · What Linux Actually Is: Kernel, Distros & the Unix Philosophy": level-1/01-what-linux-is.md
      - "02 · The Boot Process: Firmware, Bootloader & initramfs": level-1/02-boot-process.md
      - "03 · The Filesystem Hierarchy & Virtual Filesystems (/proc, /sys)": level-1/03-filesystem-hierarchy.md
      - "04 · Files, Inodes & Links: How Linux Actually Stores Data": level-1/04-inodes-links.md
      - "05 · Users, Groups & the Permission Model": level-1/05-users-permissions.md
      - "06 · Advanced Permissions: SUID, SGID, Sticky Bit & ACLs": level-1/06-suid-sgid-acls.md
      - "07 · Processes 101: PIDs, fork/exec & the Process Tree": level-1/07-processes-101.md
      - "08 · Standard Streams, File Descriptors & Pipes": level-1/08-streams-descriptors-pipes.md
      - "09 · Package Management Internals: dpkg/APT vs RPM/DNF": level-1/09-package-management-internals.md
      - "10 · Project — Build and Boot a Minimal Root Filesystem": level-1/10-project-minimal-rootfs.md
  - "Level 2 · Processes, Memory & Storage":
      - Overview: level-2/index.md
      - "01 · Process States, Signals & Job Control": level-2/01-process-states-signals.md
      - "02 · Scheduling: Nice, Priorities & the CFS": level-2/02-scheduling-cfs.md
      - "03 · Memory Management: Virtual Memory, Paging & the OOM Killer": level-2/03-memory-management.md
      - "04 · Disks & Block Devices: Partitions, LVM & Filesystems": level-2/04-disks-lvm-filesystems.md
      - "05 · Mounting, fstab & Network Filesystems": level-2/05-mounting-fstab-nfs.md
      - "06 · systemd Deep Dive: Units, Targets & Dependencies": level-2/06-systemd-deep-dive.md
      - "07 · Writing systemd Services & Timers": level-2/07-systemd-services-timers.md
      - "08 · Logging & journald: Structured Logs at the OS Level": level-2/08-journald-logging.md
      - "09 · Device Files, udev & /dev": level-2/09-device-files-udev.md
      - "10 · Project — Diagnose a Resource-Starved System": level-2/10-project-resource-diagnosis.md
  - "Level 3 · Networking & Security Internals":
      - Overview: level-3/index.md
      - "01 · The Linux Network Stack: Interfaces, IP & Routing": level-3/01-network-stack-routing.md
      - "02 · DNS Resolution on Linux: resolv.conf, nsswitch & systemd-resolved": level-3/02-dns-resolution.md
      - "03 · Netfilter & Firewalls: iptables vs nftables": level-3/03-netfilter-iptables-nftables.md
      - "04 · Sockets, Ports & the ss/netstat Toolset": level-3/04-sockets-ports-ss.md
      - "05 · SSH Internals: Keys, Agents & the Protocol": level-3/05-ssh-internals.md
      - "06 · Linux Security Modules: SELinux vs AppArmor": level-3/06-selinux-apparmor.md
      - "07 · Namespaces & Cgroups: The Building Blocks of Containers": level-3/07-namespaces-cgroups.md
      - "08 · Kernel Tuning: sysctl & /proc Parameters": level-3/08-sysctl-kernel-tuning.md
      - "09 · Auditing & Hardening: auditd and fail2ban": level-3/09-auditd-fail2ban-hardening.md
      - "10 · Project — Build a Container From Namespaces and Cgroups": level-3/10-project-mini-container.md
  - "Level 4 · Performance, Troubleshooting & Capstone":
      - Overview: level-4/index.md
